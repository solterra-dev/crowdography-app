# Crowdography iPhone app. XcodeGen turns this file into the Xcode project on the build machine,
# so the project file itself is never hand-edited or stored.
name: Crowdography
options:
  bundleIdPrefix: com.crowdography
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 4T7G5U6WR7
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  Crowdography:
    type: application
    platform: iOS
    sources:
      - path: Crowdography
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crowdography.app
        PRODUCT_NAME: Crowdography
        CODE_SIGN_ENTITLEMENTS: Crowdography/Crowdography.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Crowdography/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Crowdography/Support/Crowdography-Bridging-Header.h
    info:
      path: Crowdography/Info.plist
      properties:
        CFBundleDisplayName: Crowdography
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64, still-camera, video-camera, gps]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [fetch]
        NSCameraUsageDescription: Crowdography films with your camera so your footage can be proven real and untouched.
        NSMicrophoneUsageDescription: Crowdography records sound with your videos.
        NSLocationWhenInUseUsageDescription: Crowdography stamps where each clip was filmed. The location is part of the proof that your footage is real.
  CrowdographyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CrowdographyTests
    dependencies:
      - target: Crowdography
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crowdography.app.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Crowdography:
    build:
      targets:
        Crowdography: all
        CrowdographyTests: [test]
    test:
      targets:
        - CrowdographyTests
