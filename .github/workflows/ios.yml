name: iPhone app

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write   # only so the build can save its log to the ci-logs branch for Claude to read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 45
    defaults: { run: { working-directory: ios } }
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode on the machine (Apple requires Xcode 26 or later for uploads)
        working-directory: .
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1); echo "Using $X"; sudo xcode-select -s "$X"; xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Make the Xcode project
        run: xcodegen generate
      - name: Compile and run the tests on a simulated iPhone
        run: |
          set -o pipefail
          DEST=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcodebuild test -project Crowdography.xcodeproj -scheme Crowdography \
            -destination "id=$DEST" CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/build.log" | tail -n 120
      - name: Save the build log to the ci-logs branch
        if: always()
        working-directory: .
        run: |
          LOG="$RUNNER_TEMP/build.log"; [ -f "$LOG" ] || echo "no log (failed before compiling)" > "$LOG"
          { echo "commit ${{ github.sha }}  $(xcodebuild -version | head -1)  result ${{ job.status }}  $(date -u)"; grep -E "error:|warning: .*Crowdography|\*\* (TEST|BUILD)|Test Case|Executed" "$LOG" | head -300; echo ---; tail -n 150 "$LOG"; } > "$RUNNER_TEMP/summary.txt"
          # Each job adds only its own file to a fresh copy of the ci-logs branch, and tries again if the other job pushed first.
          for n in 1 2 3 4 5; do
            rm -rf "$RUNNER_TEMP/logs"
            git clone -q --depth 1 --branch ci-logs "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "$RUNNER_TEMP/logs" || { sleep 5; continue; }
            cp "$RUNNER_TEMP/summary.txt" "$RUNNER_TEMP/logs/ios-build.txt"
            if (cd "$RUNNER_TEMP/logs" && git config user.name "build-log" && git config user.email "build-log@users.noreply.github.com" && git add ios-build.txt && git commit -qm "iOS build log ${{ github.sha }}" && git push -q origin ci-logs); then break; fi
            sleep 5
          done

  testflight:
    # Sends a build to Apple's TestFlight, from the main branch only. Runs beside the tests, not after them, to save a few minutes:
    # these builds reach only our own team, and a failed test shows in the log at the same time.
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 60
    defaults: { run: { working-directory: ios } }
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode on the machine (Apple requires Xcode 26 or later for uploads)
        working-directory: .
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1); echo "Using $X"; sudo xcode-select -s "$X"; xcodebuild -version
      - name: Check the Apple key is set up
        id: key
        working-directory: .
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ]; then echo "ready=yes" >> "$GITHUB_OUTPUT"; else echo "No App Store Connect key yet: skipping TestFlight."; echo "ready=no" >> "$GITHUB_OUTPUT"; fi
      - name: Install XcodeGen
        if: steps.key.outputs.ready == 'yes'
        run: brew install xcodegen && xcodegen generate
      - name: Build, sign with Apple's cloud signing, and upload to TestFlight
        if: steps.key.outputs.ready == 'yes'
        run: |
          set -o pipefail
          KEYFILE="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEYFILE"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEYFILE -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          xcodebuild archive -project Crowdography.xcodeproj -scheme Crowdography -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/Crowdography.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- AD_HOC_CODE_SIGNING_ALLOWED=YES PROVISIONING_PROFILE_SPECIFIER= $AUTH 2>&1 | tee "$RUNNER_TEMP/tf.log" | tail -n 80
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Crowdography.xcarchive" \
            -exportOptionsPlist ExportOptions.plist -exportPath "$RUNNER_TEMP/export" $AUTH 2>&1 | tee -a "$RUNNER_TEMP/tf.log" | tail -n 80
          rm -f "$KEYFILE"
      - name: Save the TestFlight log to the ci-logs branch
        if: always()
        working-directory: .
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          LOG="$RUNNER_TEMP/tf.log"; [ -f "$LOG" ] || echo "no log (key missing or failed before archiving)" > "$LOG"
          { echo "commit ${{ github.sha }}  build ${{ github.run_number }}  result ${{ job.status }}  key ready: ${{ steps.key.outputs.ready }}  $(date -u)"; grep -E "error:|\*\* (ARCHIVE|EXPORT)|Upload succeeded|Upload failed|Uploaded Crowdography|App Store Connect Warning" "$LOG" | cut -c1-600 | head -60; echo ---; tail -n 25 "$LOG" | cut -c1-600; } > "$RUNNER_TEMP/tfsummary.txt"
          for n in 1 2 3 4 5; do
            rm -rf "$RUNNER_TEMP/logs"
            git clone -q --depth 1 --branch ci-logs "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "$RUNNER_TEMP/logs" || { sleep 5; continue; }
            cp "$RUNNER_TEMP/tfsummary.txt" "$RUNNER_TEMP/logs/ios-testflight.txt"
            if (cd "$RUNNER_TEMP/logs" && git config user.name "build-log" && git config user.email "build-log@users.noreply.github.com" && git add ios-testflight.txt && git commit -qm "TestFlight log ${{ github.sha }}" && git push -q origin ci-logs); then break; fi
            sleep 5
          done
